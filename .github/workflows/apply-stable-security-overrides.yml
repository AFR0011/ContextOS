name: Apply stable dependency security overrides

on:
  pull_request:

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: contextos
          POSTGRES_PASSWORD: contextos
          POSTGRES_DB: contextos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contextos -d contextos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://contextos:contextos@localhost:5432/contextos?schema=public
      AUTH_SECRET: contextos-ci-auth-secret-32-characters-minimum
      SEED_DEMO_EMAIL: demo@contextos.local
      SEED_DEMO_PASSWORD: contextos-demo-v011
      ALLOW_DEMO_RESET: "true"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate stable audited dependency graph
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.dependencies.next = '16.2.12';
          pkg.overrides = Object.assign({}, pkg.overrides, {
            esbuild: '0.28.1',
            nanoid: '6.0.0',
            postcss: '8.5.23',
            sharp: '0.35.3'
          });
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=1
      - name: Commit verified lock and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Verified dependency graph already committed."
            exit 0
          fi
          git commit -m "Patch stable Next dependency graph"
          git push origin HEAD:${{ github.head_ref }}
