name: Batch 18 release preparation

on:
  push:
    branches:
      - batch18-release-closure

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: batch18-release-closure
          fetch-depth: 0

      - name: Apply release-candidate preparation
        run: python3 scripts/batch18-prepare.py

      - name: Commit non-workflow candidate changes
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/ci.yml .github/workflows/batch18-prepare.yml
          git rm scripts/batch18-prepare.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Batch 18: prepare v1.0.0-rc.1 release candidate"
          git push origin HEAD:batch18-release-closure
