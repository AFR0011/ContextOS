name: Batch 18 stable promotion

on:
  push:
    branches:
      - batch18-release-closure

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: batch18-release-closure
          fetch-depth: 0

      - name: Apply stable release promotion
        run: python3 scripts/batch18-promote.py

      - name: Commit stable metadata
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/batch18-promote.yml
          git rm scripts/batch18-promote.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Batch 18: promote accepted RC to v1.0.0"
          git push origin HEAD:batch18-release-closure
