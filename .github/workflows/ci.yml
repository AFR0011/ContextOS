name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: contextos
          POSTGRES_PASSWORD: contextos
          POSTGRES_DB: contextos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contextos -d contextos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://contextos:contextos@localhost:5432/contextos?schema=public
      AUTH_SECRET: contextos-ci-auth-secret-32-characters-minimum
      SEED_DEMO_EMAIL: demo@contextos.local
      SEED_DEMO_PASSWORD: contextos-demo-v011
      ALLOW_DEMO_RESET: "true"
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency graph
        run: npm audit --audit-level=low

      - name: Run Stage 7 repository audit
        run: npm run audit:stage7

      - name: Validate Stage 7 evidence mapping
        run: npm run audit:stage7:evidence

      - name: Run Stage 8 deployment preflight
        env:
          NEXT_PUBLIC_APP_URL: https://contextos-preview.example
          ALLOW_PUBLIC_REGISTRATION: "false"
          ALLOW_DEMO_RESET: "false"
          CONTEXTOS_SSO_SECRET: ""
          SOCIALOS_APP_URL: https://socialos-preview.example
        run: npm run audit:stage8:preflight

      - name: Test Stage 8 deployment preflight rejection cases
        run: npm run audit:stage8:preflight:test

      - name: Run Stage 8 operational log audit
        run: npm run audit:stage8:ops

      - name: Run Stage 9 lifecycle audit
        run: npm run audit:stage9:lifecycle

      - name: Validate Stage 9 evidence registry
        run: npm run audit:stage9:evidence

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Deploy database migrations
        run: npm run db:deploy

      - name: Seed demo data
        run: npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run production offline and Stage 7 matrix
        run: npx playwright test --config=playwright.production.config.ts --workers=1

      - name: Run Playwright e2e
        run: npm run test:e2e -- --workers=1

      - name: Run database-outage smoke
        shell: bash
        run: |
          set -euo pipefail
          POSTGRES_ID="$(docker ps -q --filter ancestor=postgres:16-alpine | head -n 1)"
          if [ -z "$POSTGRES_ID" ]; then
            echo "Could not identify the disposable PostgreSQL service container." >&2
            exit 1
          fi
          docker stop "$POSTGRES_ID"

          npm run start -- --hostname 127.0.0.1 --port 3102 > /tmp/contextos-stage7-db-outage.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          READY=0
          for _ in $(seq 1 30); do
            if curl -sS -o /dev/null http://127.0.0.1:3102/login; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/contextos-stage7-db-outage.log >&2 || true
            exit 1
          fi

          STAGE7_BASE_URL=http://127.0.0.1:3102 node scripts/stage7-db-outage-smoke.mjs
