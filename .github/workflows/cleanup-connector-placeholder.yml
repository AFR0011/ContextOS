name: One-time connector cleanup

on:
  push:
    branches:
      - chore/publication-readiness

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/publication-readiness
          fetch-depth: 0
      - name: Remove accidental placeholder and this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -f NON_EXISTENT
          git rm -f .github/workflows/cleanup-connector-placeholder.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove connector cleanup artifacts'
          git push origin HEAD:chore/publication-readiness
