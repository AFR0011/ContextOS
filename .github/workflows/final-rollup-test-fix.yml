name: One-time rollup assertion fix

on:
  push:
    branches:
      - chore/publication-readiness

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/publication-readiness
          fetch-depth: 0
      - name: Remove redundant ambiguous rollup text assertions
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/e2e/contextos.spec.ts')
          text = path.read_text(encoding='utf-8')
          old = '''  await expect(page.getByTestId("project-live-tasks").getByText(subcontext)).toBeVisible();\n  await expect(page.getByTestId("project-live-tasks").getByLabel(`Task title ${childTask}`)).toBeVisible();\n  await expect(page.getByTestId("project-live-dates").getByText(subcontext)).toBeVisible();\n  await expect(page.getByTestId("project-live-dates").getByLabel(`Date title ${childDate}`)).toBeVisible();'''
          new = '''  await expect(page.getByTestId("project-live-tasks").getByLabel(`Task title ${childTask}`)).toBeVisible();\n  await expect(page.getByTestId("project-live-dates").getByLabel(`Date title ${childDate}`)).toBeVisible();'''
          if old not in text:
              raise SystemExit('Expected rollup assertions not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Validate patch
        run: git diff --check
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/contextos.spec.ts
          git commit -m 'Use semantic task and date assertions for subcontext rollup'
          git push origin HEAD:chore/publication-readiness
