name: One-time final Playwright locator fix

on:
  push:
    branches:
      - chore/publication-readiness

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/publication-readiness
          fetch-depth: 0
      - name: Fix subcontext accessible-name locator
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/e2e/contextos.spec.ts')
          text = path.read_text(encoding='utf-8')
          old = '  const subcontextButton = page.getByTestId("project-subcontexts").getByRole("button", { name: subcontext, exact: true });'
          new = '  const subcontextButton = page.getByTestId("project-subcontexts").getByRole("button", { name: new RegExp(`^${subcontext}`) });'
          if old not in text:
              raise SystemExit('Expected subcontext locator not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Validate patch
        run: git diff --check
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/contextos.spec.ts
          git commit -m 'Fix subcontext Playwright accessible-name locator'
          git push origin HEAD:chore/publication-readiness
