name: Generate security lockfile

on:
  pull_request:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://contextos:contextos@localhost:5432/contextos?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install regenerated dependency graph
        run: npm ci
      - name: Report resolved audit surface
        shell: bash
        run: |
          npm audit --json > /tmp/audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
          console.log('AUDIT=' + JSON.stringify(audit.metadata?.vulnerabilities ?? {}));
          for (const [name, entry] of Object.entries(audit.vulnerabilities ?? {})) {
            console.log(`VULN ${name} severity=${entry.severity} direct=${entry.isDirect} range=${entry.range}`);
          }
          NODE
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: contextos-security-lock
          path: package-lock.json
          if-no-files-found: error
