name: One-time Playwright repair

on:
  push:
    branches:
      - chore/publication-readiness

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/publication-readiness
          fetch-depth: 0

      - name: Repair stale E2E assertions and editor command race
        shell: python
        run: |
          from pathlib import Path

          test_path = Path('tests/e2e/contextos.spec.ts')
          text = test_path.read_text(encoding='utf-8')

          replacements = [
              (
                  '  await expect(page.getByText("16:30")).toBeVisible();',
                  '  await expect(page.getByText("16:30", { exact: true })).toBeVisible();'
              ),
              (
                  '''  await markdownLine(page.getByTestId("project-recovery-notes"), 0).fill(note);\n  await expect(page.getByText("Saved").first()).toBeVisible({ timeout: 3000 });\n  await page.reload();\n  await expect(page.getByPlaceholder("Concrete next action...")).toHaveValue(nextAction);\n  await expect(markdownLine(page.getByTestId("project-recovery-notes"), 0)).toHaveValue(note);''',
                  '''  await markdownLine(page.getByTestId("project-recovery-notes"), 0).fill(note);\n  await expect.poll(() => workspaceProjectRecoveryIncludes(page, "ContextOS Demo", note)).toBe(true);\n  await page.reload();\n  await expect(page.getByPlaceholder("Concrete next action...")).toHaveValue(nextAction);\n  await expect.poll(() => workspaceProjectRecoveryIncludes(page, "ContextOS Demo", note)).toBe(true);'''
              ),
              (
                  '''  await expect(page.getByRole("button", { name: new RegExp(subcontext) })).toBeVisible();\n\n  await page.getByRole("button", { name: new RegExp(subcontext) }).click();''',
                  '''  const subcontextButton = page.getByTestId("project-subcontexts").getByRole("button", { name: subcontext, exact: true });\n  await expect(subcontextButton).toBeVisible();\n\n  await subcontextButton.click();'''
              ),
              (
                  '''  const beforeDoneOrder = await taskTitleOrder(taskSection);\n  await taskSection.getByRole("button", { name: `Mark ${renamed} done` }).click();\n  await expect(taskSection.getByLabel(`Task title ${renamed}`)).toBeVisible();\n  await expect(taskSection.getByRole("button", { name: `Reopen ${renamed}` })).toBeVisible();\n  await expectTaskTitleOrder(taskSection, beforeDoneOrder);''',
                  '''  await taskSection.getByRole("button", { name: `Mark ${renamed} done` }).click();\n  const doneTodayGroup = page.getByTestId("command-task-group-done-today");\n  await expect(doneTodayGroup.getByLabel(`Task title ${renamed}`)).toBeVisible();\n  await expect(doneTodayGroup.getByRole("button", { name: `Reopen ${renamed}` })).toBeVisible();'''
              ),
              (
                  '''  await expect(page.getByText(areaProject)).toBeVisible();\n  await page.getByRole("button", { name: `Delete ${areaProject}` }).click();\n  await expect(page.getByText(areaProject)).not.toBeVisible();''',
                  '''  const areaProjectButton = page.getByRole("main").getByRole("button", { name: areaProject, exact: true });\n  await expect(areaProjectButton).toBeVisible();\n  await page.getByRole("button", { name: `Delete ${areaProject}` }).click();\n  await expect(areaProjectButton).toHaveCount(0);'''
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected test snippet not found:\n{old}')
              text = text.replace(old, new, 1)

          # The previous helper asserted a global flattened task order even though
          # Dashboard2 deliberately moves completed-today tasks to a Done today group.
          helper = '''async function expectTaskTitleOrder(container: Locator, expectedOrder: string[]) {\n  await expect.poll(() => taskTitleOrder(container)).toEqual(expectedOrder);\n}\n\n'''
          if helper in text:
              text = text.replace(helper, '', 1)

          test_path.write_text(text, encoding='utf-8')

          editor_path = Path('src/components/workspace/editor/BlockMarkdownEditor.tsx')
          editor = editor_path.read_text(encoding='utf-8')
          old = '''      if (event.key === "Enter") {\n        event.preventDefault();\n        const selected = filteredCommands[slashSelectedIndex];\n        if (selected) applyCommandToBlock(block.id, selected, slashCommand.triggerIndex, liveText);\n        else setSlashCommand(null);\n        return;\n      }'''
          new = '''      if (event.key === "Enter") {\n        event.preventDefault();\n        // `fill()`/fast typing can leave the slash-menu state one render behind the\n        // textarea value. Prefer a complete typed command from the live value before\n        // falling back to the currently selected menu entry.\n        const typedCommand = commandForLine(liveText, commands);\n        if (typedCommand) applyCommandToBlock(block.id, typedCommand, 0, liveText);\n        else {\n          const selected = filteredCommands[slashSelectedIndex];\n          if (selected) applyCommandToBlock(block.id, selected, slashCommand.triggerIndex, liveText);\n          else setSlashCommand(null);\n        }\n        return;\n      }'''
          if old not in editor:
              raise SystemExit('Expected BlockMarkdownEditor Enter handler not found')
          editor_path.write_text(editor.replace(old, new, 1), encoding='utf-8')

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'getByText("16:30", { exact: true })' tests/e2e/contextos.spec.ts
          grep -F 'command-task-group-done-today' tests/e2e/contextos.spec.ts
          grep -F 'const typedCommand = commandForLine(liveText, commands);' src/components/workspace/editor/BlockMarkdownEditor.tsx

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/contextos.spec.ts src/components/workspace/editor/BlockMarkdownEditor.tsx
          git commit -m 'Repair Playwright coverage and slash command race'
          git push origin HEAD:chore/publication-readiness
