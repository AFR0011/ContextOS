name: Publication finalizer

on:
  push:
    branches:
      - chore/publication-readiness

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/publication-readiness
          fetch-depth: 0

      - name: Final cleanup
        shell: python
        run: |
          from pathlib import Path
          import shutil

          replacements = {
              'Benchmark support audit is complete. one benchmark regression scenario still needs validation.': 'Benchmark support audit is complete. One benchmark regression scenario still needs validation.',
              'proj-thesis': 'proj-benchmark',
              'proj-career': 'proj-release',
              'ContextOS v0.1 verification pass': 'ContextOS verification pass',
              'The user-supplied `Notion-style editor demo/` folder remains a reference artifact only and is excluded from app TypeScript compilation.\n': '',
          }

          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.md', '.ts', '.tsx', '.js', '.mjs', '.json'}:
                  continue
              if any(part in {'.git', 'node_modules', '.next'} for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          for directory in ['Notion-style editor demo', 'docs/archive']:
              target = Path(directory)
              if target.exists():
                  shutil.rmtree(target)

          for filename in [
              'DEV_LOG.md', 'DEV_STATE.md', 'QA_REPORT.md', 'RISK_REGISTER.md',
              'docs/AUDIT_2026-06-15.md', 'docs/MIGRATION_BACKLOG.md', 'docs/VERSION_LOG.md'
          ]:
              target = Path(filename)
              if target.exists():
                  target.unlink()

      - name: Validate publication tree
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -n -E 'Dev / Freelance|Career / PhD|MSc Thesis|Rerun RF baseline with corrected threshold logic|Piano Schedule|Piano / Content|KPMG Application|Semester 12-3 Assistantship'
          ! test -e 'Notion-style editor demo'
          git diff --check

      - name: Commit if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'Publication tree already finalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize publication tree'
          git push origin HEAD:chore/publication-readiness
