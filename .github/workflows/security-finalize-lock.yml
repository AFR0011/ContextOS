name: Finalize Security Lockfile

on:
  push:
    branches:
      - security/next-16.3.4

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://contextos:contextos@localhost:5432/contextos?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Regenerate dependency graph
        run: npm install

      - name: Require clean dependency audit
        run: npm audit --audit-level=low

      - name: Verify Prisma generation explicitly
        run: npx prisma generate

      - name: Typecheck patched graph
        run: npm run typecheck

      - name: Remove temporary security evidence and generator
        run: rm .github/workflows/security-finalize-lock.yml npm-audit-after-next.json npm-install-diagnostic.txt

      - name: Commit clean generated dependency graph
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/security-finalize-lock.yml npm-audit-after-next.json npm-install-diagnostic.txt
          git commit -m "security: finalize patched dependency graph"
          git push origin HEAD:security/next-16.3.4
