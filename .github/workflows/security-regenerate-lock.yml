name: Capture Security Install Failure

on:
  push:
    branches:
      - security/next-16.3.4

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Capture npm install diagnostics
        shell: bash
        run: |
          set +e
          npm install > npm-install-diagnostic.txt 2>&1
          STATUS=$?
          set -e
          printf '\nnpm install exit status: %s\n' "$STATUS" >> npm-install-diagnostic.txt
          git restore package-lock.json || true

      - name: Remove temporary diagnostic workflow
        run: rm .github/workflows/security-regenerate-lock.yml

      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add npm-install-diagnostic.txt .github/workflows/security-regenerate-lock.yml
          git commit -m "chore: capture security dependency install diagnostics"
          git push origin HEAD:security/next-16.3.4
