name: Stage 5 local router rewrite

on:
  push:
    branches:
      - feat/local-first-completion-stage5

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/local-first-completion-stage5
          fetch-depth: 0

      - name: Replace workspace view router import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/workspace/Views.tsx')
          source = path.read_text()
          old = 'import { useRouter } from "next/navigation";'
          new = 'import { useLocalRouter as useRouter } from "@/lib/local-router";'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one Next router import, found {count}')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Remove one-shot workflow and commit rewrite
        run: |
          rm .github/workflows/stage5-local-router-rewrite.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/workspace/Views.tsx .github/workflows/stage5-local-router-rewrite.yml
          git commit -m "feat: route workspace view navigation locally"
          git push origin HEAD:feat/local-first-completion-stage5
