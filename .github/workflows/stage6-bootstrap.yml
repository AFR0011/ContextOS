name: Stage 6 bootstrap

on:
  push:
    branches:
      - feat/local-first-completion-stage5
    paths:
      - .github/workflows/stage6-bootstrap.yml

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/local-first-completion-stage5
          fetch-depth: 0
      - name: Create Stage 6 branch
        run: |
          git push origin HEAD:refs/heads/feat/local-first-completion-stage6
      - name: Remove bootstrap workflow from Stage 5
        run: |
          rm .github/workflows/stage6-bootstrap.yml
          git config user.name "Ali Farrokhnejad"
          git config user.email "farrokh445@gmail.com"
          git add .github/workflows/stage6-bootstrap.yml
          git commit -m "chore: remove Stage 6 branch bootstrap"
          git push origin HEAD:feat/local-first-completion-stage5
