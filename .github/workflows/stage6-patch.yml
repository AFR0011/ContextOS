name: Stage 6 patch
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/feat/local-first-completion-stage6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/local-first-completion-stage6
      - run: python scripts/patch-stage6-sw-test.py
      - run: |
          rm scripts/patch-stage6-sw-test.py
          rm .github/workflows/stage6-patch.yml
          rm -f .github/workflows/stage6-sw-test-update.yml
          git config user.name "Ali Farrokhnejad"
          git config user.email "farrokh445@gmail.com"
          git add tests/e2e/contextos.spec.ts scripts/patch-stage6-sw-test.py .github/workflows/stage6-patch.yml .github/workflows/stage6-sw-test-update.yml
          git commit -m "test: align deployment assertions with Stage 6 shell"
          git push origin HEAD:feat/local-first-completion-stage6
