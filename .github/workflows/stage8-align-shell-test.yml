name: Stage 8 shell assertion alignment

on:
  push:
    branches:
      - feat/local-first-completion-stage8
    paths:
      - .github/workflows/stage8-align-shell-test.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/local-first-completion-stage8
          fetch-depth: 0
      - name: Align the single stale shell-version assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/e2e/contextos.spec.ts")
          text = path.read_text()
          old = "expect(serviceWorker).toContain('const SHELL_VERSION = \\\"v3\\\"');"
          new = "expect(serviceWorker).toContain('const SHELL_VERSION = \\\"v4\\\"');"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one stale v3 assertion, found {count}")
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/stage8-align-shell-test.yml
      - name: Commit the test-only correction and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/contextos.spec.ts .github/workflows/stage8-align-shell-test.yml
          git commit -m "test: align metadata assertion with v4 shell"
          git push origin HEAD:feat/local-first-completion-stage8
