services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: contextos
      POSTGRES_PASSWORD: contextos
      POSTGRES_DB: contextos
    ports:
      - "54329:5432"
    volumes:
      - contextos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextos -d contextos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  contextos-postgres-data:
